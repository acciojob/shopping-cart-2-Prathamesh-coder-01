<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
</head>
<body>

  <input
    type="text"
    id="item-name-input"
    placeholder="Item Name"
  />

  <input
    type="number"
    id="item-price-input"
    placeholder="Item Price"
  />

  <button id="add-btn">Add</button>

  <table border="1">
    <tbody id="table-body">
      <tr id= "total-row">
        <td>Grand Total</td>
        <td data-ns-test="grandTotal">0</td>
      </tr>
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
